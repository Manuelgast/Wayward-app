# Wayward iOS build in the cloud (Codemagic, Mac mini M2, free tier: 500 minutes a month).
# Builds the same web book as the Android app, signs it for the App Store and uploads it to App Store Connect.
# Sending it to Apple for review is not done here: that stays a manual step after Manuel's yes.
#
# Signing and upload go through the App Store Connect API key stored in Codemagic
# (Settings > Integrations > Developer Portal, key name "Wayward"). The distribution certificate and the App Store
# profile for com.waywardbooks.app are fetched or created during the build; that needs one secret variable,
# CERTIFICATE_PRIVATE_KEY (group "code-signing", the text of ios-distribution-certificate-key.pem). No secrets live in this file.
workflows:
  ios-appstore:
    name: Wayward iOS to App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Wayward
    environment:
      groups:
        - code-signing
      vars:
        BUNDLE_ID: com.waywardbooks.app
        XCODE_PROJECT: app/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Install packages
        script: cd app && npm ci
      - name: Build the book and copy it into the iOS project
        script: cd app && python3 scripts/build_www.py ../web-src && npx cap sync ios
      - name: Same version as Android (build.gradle)
        script: |
          VN=$(grep -oE 'versionName "[^"]+"' app/android/app/build.gradle | cut -d'"' -f2)
          VC=$(grep -oE 'versionCode [0-9]+' app/android/app/build.gradle | awk '{print $2}')
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VN;/; s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $VC;/" "$XCODE_PROJECT/project.pbxproj"
          echo "iOS version $VN ($VC)"
      - name: Privacy manifest in the app target
        script: |
          gem list -i xcodeproj >/dev/null || gem install xcodeproj --no-document
          ruby app/scripts/add_privacy_manifest.rb
      - name: Signing (certificate and App Store profile are fetched, or created when missing)
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is missing: add it under Environment variables, group code-signing (task TL1 step 5c)."
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build the ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

# Wayward: one update route, like ExamTwin.
#
#   change on a branch -> pull request -> merge into main -> Codemagic builds BOTH apps by itself:
#     - Android: signed App Bundle on the Google Play INTERNAL TESTING track
#     - iOS:     signed build in App Store Connect (TestFlight, internal testers)
#   Going public stays Manuel's own click: "Promote release" to Production in Play Console,
#   and "Submit for Review" in App Store Connect.
#
# Build numbers go up by themselves (latest number in Google Play / TestFlight + 1), so nobody has to edit
# versionCode for an update. The version NAME (e.g. 1.1.3) stays in app/android/app/build.gradle and is raised
# by the chat that makes a real update (both apps use it).
#
# Only changes to the app itself start a build (web-src/, app/, this file). Store texts, graphics and listing
# files do not, which saves Codemagic minutes (free tier: 500 Mac minutes a month).
#
# Secrets live in Codemagic, never in this repo (Manuel added them once):
#   - Android upload keystore: Code signing identities > Android keystores, reference "wayward_upload"
#   - Google Play service account key (JSON): secure variable GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, group "google_play"
#   - App Store Connect API key: Integrations > Developer Portal, key name "Wayward"
#   - iOS distribution certificate key: secure variable CERTIFICATE_PRIVATE_KEY, group "code-signing"

definitions:
  app_changes: &app_changes
    changeset:
      includes:
        - 'web-src/**'
        - 'app/**'
        - 'codemagic.yaml'
  on_main: &on_main
    events:
      - push
    branch_patterns:
      - pattern: main
        include: true
        source: true
    cancel_previous_builds: true

workflows:
  android-play:
    name: Wayward Android to Google Play (internal testing)
    instance_type: mac_mini_m2
    max_build_duration: 40
    triggering: *on_main
    when: *app_changes
    environment:
      android_signing:
        - wayward_upload
      groups:
        - google_play
      vars:
        PACKAGE_NAME: com.waywardbooks.app
      node: 22
      java: 21
    scripts:
      - name: Check the two secrets
        script: |
          if [ -z "${CM_KEYSTORE_PATH:-}" ]; then echo "Upload keystore 'wayward_upload' is missing in Code signing identities."; exit 1; fi
          if [ -z "${GCLOUD_SERVICE_ACCOUNT_CREDENTIALS:-}" ]; then echo "GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is missing (group google_play)."; exit 1; fi
      - name: Next build number (latest in Google Play + 1)
        script: |
          GRADLE=app/android/app/build.gradle
          CURRENT=$(grep -oE 'versionCode [0-9]+' "$GRADLE" | awk '{print $2}')
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --credentials "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" 2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$LATEST" -ge "$CURRENT" ] 2>/dev/null; then NEXT=$((LATEST + 1)); else NEXT=$((CURRENT + 1)); echo "Could not read Google Play, using build.gradle + 1"; fi
          sed -i '' -E "s/versionCode [0-9]+/versionCode $NEXT/" "$GRADLE"
          echo "versionCode $NEXT (Google Play had: ${LATEST:-unknown})"
      - name: Install packages
        script: cd app && npm ci
      - name: Build the book and copy it into the Android project
        script: cd app && python3 scripts/build_www.py ../web-src && npx cap sync android
      - name: Android SDK and signing for Gradle
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > app/android/local.properties
          {
            echo "storeFile=$CM_KEYSTORE_PATH"
            echo "storePassword=$CM_KEYSTORE_PASSWORD"
            echo "keyAlias=$CM_KEY_ALIAS"
            echo "keyPassword=$CM_KEY_PASSWORD"
          } > app/keystore.properties
      - name: Build the signed App Bundle
        script: |
          cd app/android && ./gradlew --no-daemon bundleRelease
          VN=$(grep -oE 'versionName "[^"]+"' app/build.gradle | cut -d'"' -f2)
          VC=$(grep -oE 'versionCode [0-9]+' app/build.gradle | awk '{print $2}')
          echo "Built Wayward $VN ($VC)"
      - name: Remove the signing file
        script: rm -f app/keystore.properties
    artifacts:
      - app/android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: false

  ios-appstore:
    name: Wayward iOS to App Store Connect (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering: *on_main
    when: *app_changes
    integrations:
      app_store_connect: Wayward
    environment:
      groups:
        - code-signing
      vars:
        BUNDLE_ID: com.waywardbooks.app
        APP_STORE_APPLE_ID: 6817012408
        XCODE_PROJECT: app/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Install packages
        script: cd app && npm ci
      - name: Build the book and copy it into the iOS project
        script: cd app && python3 scripts/build_www.py ../web-src && npx cap sync ios
      - name: Version name from build.gradle, build number = latest in TestFlight + 1
        script: |
          VN=$(grep -oE 'versionName "[^"]+"' app/android/app/build.gradle | cut -d'"' -f2)
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          case "$LATEST" in ''|*[!0-9]*) LATEST=$(grep -oE 'versionCode [0-9]+' app/android/app/build.gradle | awk '{print $2}'); echo "Could not read TestFlight, using versionCode";; esac
          BN=$((LATEST + 1))
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VN;/; s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BN;/" "$XCODE_PROJECT/project.pbxproj"
          echo "iOS version $VN ($BN)"
      - name: Privacy manifest in the app target
        script: |
          gem list -i xcodeproj >/dev/null || gem install xcodeproj --no-document
          ruby app/scripts/add_privacy_manifest.rb
      - name: Signing (certificate and App Store profile are fetched, or created when missing)
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is missing: add it under Environment variables, group code-signing."
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build the ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

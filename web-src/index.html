      <button class="icon-btn glassbtn" id="mAsText" data-i18n-aria="readAsText"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5C5.5 4 8.5 4 12 6c3.5-2 6.5-2 9-.5V19c-2.5-1.5-5.5-1.5-9 .5-3.5-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/></svg></button>
      <div class="tb-center"><span class="caps gold" id="mPage"></span><span class="tb-sub" id="mChapter"></span></div>
      <span style="width:44px;flex:0 0 44px"></span>
    </div>
    <div class="vprog"><div id="mProg"></div></div>
    <div class="moment-body">
      <p class="subtitle" id="mSub" aria-live="polite"></p>
      <button class="skip" id="mSkip" hidden data-i18n="tapContinue"></button>
      <div class="decide" id="mDecide" hidden>
        <div class="timer-row">
          <div class="timer"><svg width="68" height="68" viewBox="0 0 68 68" aria-hidden="true"><defs><linearGradient id="tRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD07A"/><stop offset="1" stop-color="#F0503A"/></linearGradient><radialGradient id="tDisc" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#3E3278"/><stop offset="1" stop-color="#110D2A"/></radialGradient></defs><circle cx="34" cy="34" r="32" fill="url(#tDisc)" stroke="rgba(255,255,255,.18)"/><circle cx="34" cy="34" r="26" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4.5"/><circle id="mRing" cx="34" cy="34" r="26" fill="none" stroke="url(#tRing)" stroke-width="4.5" stroke-dasharray="163.4" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 34 34)"/><ellipse cx="27" cy="18" rx="13" ry="5" fill="#fff" opacity=".13"/></svg><span id="mSec">10</span></div>
          <div class="timer-copy"><strong id="mTimerHead"></strong><span id="mTimerSub"></span></div>
        </div>
        <div class="mchoices" id="mChoices"></div>
      </div>
    </div>
  </section>

  <!-- ENDING -->
  <section class="screen" id="ending" hidden>
    <div class="shade-top"></div>
    <div class="scroll-y"><div class="end-body">
      <div id="eMedal"></div>
      <div class="badges"><span class="badge new" id="eNew" hidden data-i18n="newEnding"></span><span class="badge star" id="eStar" hidden data-i18n="trueEnding"></span><span class="badge silver" id="eSilver" hidden data-i18n="silverEnding"></span></div>
      <span class="caps end-no" id="eNo"></span>
      <h1 class="gold-foil end-the" data-i18n="theEnd"></h1>
      <h2 class="end-title" id="eTitle"></h2>
      <p class="end-epi" id="eEpi"></p>
      <div class="path" id="ePath"></div>
      <p class="end-count" id="eCount"></p>
      <div class="end-actions">
        <button class="btn-gold lg" id="eRewind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.7L3 8"/><path d="M3 3v5h5"/></svg><span id="eRewindLabel"></span><span class="shine"></span></button>
        <span class="end-cap" data-i18n="fingerCap"></span>
        <button class="btn-glass" id="eFinger" hidden></button>
        <div class="row2"><button class="btn-glass" id="eRestart" data-i18n="startOver"></button><button class="btn-glass" data-go="map" data-i18n="seeMap"></button></div>
      </div>
    </div></div>
    <div class="topbar">
      <button class="icon-btn glassbtn" data-go="library" data-i18n-aria="closeBook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="icon-btn glassbtn" data-go="endings" data-i18n-aria="allEndings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14l-2 7 5.5-3 5.5 3-2-7"/></svg></button>
    </div>
  </section>

  <!-- MAP -->
  <section class="screen opaque" id="map" hidden>
    <div class="glow-a"></div><div class="glow-b"></div>
    <div class="scroll-y"><div class="page-pad">
      <header class="plain-head">
        <button class="icon-btn solidbtn" id="mapBack" data-i18n-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span data-i18n="paths"></span>
        <button class="icon-btn solidbtn" id="mapLocate" data-i18n-aria="centerMap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      </header>
      <h1 class="gold-foil page-title" data-book="title"></h1>
      <p class="page-sub" data-i18n="mapSub"></p>
      <div class="stats" id="mapStats"></div>
      <div class="mapbox"><div class="mapscroll" id="mapScroll"><svg id="mapSvg" role="img"></svg></div><div class="map-hint" data-i18n="mapHint"></div><div class="map-zoom"><button class="mz" id="mapZoomIn" data-i18n-aria="zoomIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button><button class="mz" id="mapZoomOut" data-i18n-aria="zoomOut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button><button class="mz" id="mapZoomAll" aria-pressed="false" data-i18n-aria="zoomAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div></div>
      <div class="legend">
        <span><svg width="18" height="6" viewBox="0 0 18 6" aria-hidden="true"><path d="M1 3H17" stroke="#F6D27C" stroke-width="2.6" stroke-linecap="round"/></svg><span data-i18n="lgPath"></span></span>
        <span><svg width="16" height="12" viewBox="-14 -8 28 20" aria-hidden="true"><path d="M0 -7 L13 0 L0 7 L-13 0Z" fill="#9FE0C0"/><path d="M-13 0 L0 7 L0 11 L-13 4Z" fill="#7A5A8E"/><path d="M13 0 L0 7 L0 11 L13 4Z" fill="#56406E"/></svg><span data-i18n="lgRead"></span></span>
        <span><svg width="10" height="14" viewBox="-6 -8 12 16" aria-hidden="true"><path d="M0 -7 L-5 0 L0 0Z" fill="#FFF3C8"/><path d="M0 -7 L5 0 L0 0Z" fill="#F2C766"/><path d="M-5 0 L0 7 L0 0Z" fill="#C9933C"/><path d="M5 0 L0 7 L0 0Z" fill="#8E5E1E"/></svg><span data-i18n="lgEnding"></span></span>
        <span><svg width="16" height="12" viewBox="-14 -8 28 20" aria-hidden="true"><path d="M0 -7 L13 0 L0 7 L-13 0Z" fill="none" stroke="#DCD2FF" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="3 2"/></svg><span data-i18n="lgFog"></span></span>
      </div>
    </div></div>
  </section>

  <!-- ENDINGS -->
  <section class="screen opaque" id="endings" hidden>
    <div class="glow-a"></div><div class="glow-b"></div>
    <div class="scroll-y"><div class="page-pad">
      <header class="plain-head">
        <button class="icon-btn solidbtn" data-go="library" data-i18n-aria="backLibrary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span data-i18n="endings"></span><span style="width:44px"></span>
      </header>
      <h1 class="gold-foil page-title" data-book="title"></h1>
      <p class="page-sub" id="endCount"></p>
      <div class="medals" id="medalGrid"></div>
    </div></div>
  </section>

  <!-- COLLECTION (1.2): every series and your progress in it -->
  <section class="screen opaque" id="collection" hidden>
    <div class="glow-a"></div><div class="glow-b"></div>
    <div class="scroll-y"><div class="page-pad">
      <header class="plain-head">
        <button class="icon-btn solidbtn" data-go="library" data-i18n-aria="backLibrary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span data-i18n="collection"></span><span style="width:44px"></span>
      </header>
      <h1 class="gold-foil page-title" data-i18n="collection"></h1>
      <p class="page-sub" data-i18n="collectionSub"></p>
      <div id="colList"></div>
    </div></div>
  </section>

  <!-- PROFILE (1.2): reader level, daily streak, streak bonus -->
  <section class="screen opaque" id="profile" hidden>
    <div class="glow-a"></div><div class="glow-b"></div>
    <div class="scroll-y"><div class="page-pad">
      <header class="plain-head">
        <button class="icon-btn solidbtn" data-go="library" data-i18n-aria="backLibrary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span data-i18n="profile"></span><span style="width:44px"></span>
      </header>
      <div id="profBody"></div>
    </div></div>
  </section>

  <!-- RELICS -->
  <section class="screen opaque" id="relics" hidden>
    <div class="glow-a"></div><div class="glow-b"></div>
    <div class="scroll-y"><div class="page-pad">
      <header class="plain-head">
        <button class="icon-btn solidbtn" data-go="library" data-i18n-aria="backLibrary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span data-i18n="relics"></span><span style="width:44px"></span>
      </header>

    </div></div>

    <div class="glow-a"></div><div class="glow-b"></div>
    <div class="scroll-y"><div class="page-pad">
      <header class="plain-head">
        <button class="icon-btn solidbtn" data-go="relics" data-i18n-aria="secretBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span class="gold" id="secLabel"></span><span style="width:44px"></span>
      </header>
      <div class="secret-page"><h2 id="secTitle"></h2><div id="secText"></div><div class="sign" id="secSign"></div></div>
    </div></div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5C5.5 4 8.5 4 12 6c3.5-2 6.5-2 9-.5V19c-2.5-1.5-5.5-1.5-9 .5-3.5-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/></svg><span data-i18n="tabLibrary"></span><span class="dot"></span></button>
    <button class="tab" data-tab="collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="6" width="4.5" height="13.5" rx="1"/><rect x="9.5" y="4" width="4.5" height="15.5" rx="1"/><path d="M15.4 7.2l4-1.1 3 12.3-4 1.1z"/><path d="M2 21.5h20"/></svg><span data-i18n="tabCollection"></span><span class="dot"></span></button>
    <button class="tab" data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><circle cx="5.5" cy="19.5" r="2"/><circle cx="18.5" cy="19.5" r="2"/><path d="M12 6.5v4M12 10.5l-5.5 7M12 10.5l5.5 7"/></svg><span data-i18n="tabPaths"></span><span class="dot"></span></button>
    <button class="tab" data-tab="endings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14l-2 7 5.5-3 5.5 3-2-7"/></svg><span data-i18n="tabEndings"></span><span class="dot"></span></button>
    <button class="tab" data-tab="relics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7z"/></svg><span data-i18n="tabRelics"></span><span class="dot"></span></button>
  </nav>
  <div class="toast" id="toast" hidden></div>
  <div class="sheetbg" id="sheetBg" hidden></div>
  <div class="sheet glass" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <span class="caps gold" id="sheetCaps"></span>
    <h3 id="sheetTitle"></h3>
    <p id="sheetText"></p>
    <div class="row2"><button class="btn-glass" id="sheetClose" data-i18n="close"></button><button class="btn-gold sm" id="sheetGo"></button></div>
  </div>
  <div class="sheet glass" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h3 id="setTitle" data-i18n="settings"></h3>
    <div class="setrow"><span data-i18n="langLabel"></span><div class="seg" id="setLang"><button data-lang="en">English</button><button data-lang="nl">Nederlands</button></div></div>
    <div class="setrow"><span data-i18n="music"></span><input type="range" class="vol" id="volMusic" min="0" max="100" step="5" aria-label="Music volume"></div>
    <div class="setrow"><span data-i18n="sfx"></span><input type="range" class="vol" id="volSfx" min="0" max="100" step="5" aria-label="Sound effects volume"></div>
    <div class="setcol"><span style="font-size:14px;font-weight:700" data-i18n="textSpeed"></span><div class="seg" id="setSpeed" style="justify-content:flex-start"><button data-v="calm" data-i18n="spCalm"></button><button data-v="read" data-i18n="spRead"></button><button data-v="fast" data-i18n="spFast"></button></div></div>

    <div class="setcol ex-row"><span class="set-l"><span data-i18n="exlibris"></span><small data-i18n="exlibrisSub"></small></span><input type="text" id="exName" maxlength="24" autocomplete="off" spellcheck="false" enterkeyhint="done"><div class="ex-seals" id="exSeals"></div></div>
    <button class="btn-glass sm cr-btn" id="setCredits" data-i18n="credits"></button>
    <button class="btn-gold sm" id="setDone" style="margin-top:6px" data-i18n="done"></button>
  </div>

    <div class="cr-body" id="crBody"></div>
    <button class="btn-gold sm" id="crDone" data-i18n="done"></button>
  </div>
  <div id="cardHost"></div>

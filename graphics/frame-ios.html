<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../app/www/fonts/fonts.css">
<style>
  html,body{margin:0}
  body{width:1320px;height:2868px;overflow:hidden;position:relative;background:#0D0A1C}
  /* the screen itself, blurred and darkened, fills the background: colour and light come from the scene */
  .bg{position:absolute;inset:-100px;background-size:cover;background-position:center 30%;filter:blur(46px) saturate(1.15) brightness(.55);transform:scale(1.08)}
  .shade{position:absolute;inset:0;background:
      radial-gradient(ellipse 80% 40% at 50% 70%, rgba(255,196,120,.16), rgba(255,196,120,0) 70%),
      linear-gradient(180deg, rgba(10,7,22,.82) 0%, rgba(10,7,22,.35) 26%, rgba(10,7,22,.25) 60%, rgba(10,7,22,.7) 100%)}
  h1{position:absolute;top:190px;left:90px;right:90px;margin:0;text-align:center;
    font-family:'Cormorant Garamond';font-weight:600;font-size:108px;line-height:1.06;letter-spacing:-.005em;color:#F4EAD5;text-wrap:balance;
    text-shadow:0 3px 22px rgba(0,0,0,.55)}
  h1 em{display:block;font-style:italic;font-weight:600;
    background:linear-gradient(180deg,#FFF3D2 0%,#F6D588 40%,#E2A94E 78%,#B57A2E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .phone{position:absolute;left:50%;bottom:-60px;width:1020px;height:2216px;margin-left:-510px;border-radius:120px;overflow:hidden;
    box-shadow:0 0 0 2px rgba(246,210,124,.5),0 0 0 18px #06040D,0 0 0 21px rgba(255,255,255,.1),0 60px 120px rgba(0,0,0,.75),0 0 90px rgba(255,190,110,.12)}
  .phone img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
</style></head>
<body>
<div class="bg" id="bg"></div>
<div class="shade"></div>
<h1 id="cap"></h1>
<div class="phone"><img id="shot"></div>
<script>
  const q = new URLSearchParams(location.search), img = q.get('img');
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  document.getElementById('cap').innerHTML = esc(q.get('cap')).replace(/\*([^*]+)\*/g, '<em>$1</em>');
  document.getElementById('shot').src = img;
  document.getElementById('bg').style.backgroundImage = 'url("' + img + '")';
</script>
</body></html>
